# Imaging settings (D059). Loaded once at startup; changes are reviewed config.
# The low-NDVI threshold depends on the crop, so it lives in each crop's YAML
# (config/crops/*.yaml, imaging.low_ndvi_threshold; D077).

# The text prompt sent to SAM 3.1 with the RGB image. SAM answers to what the
# image looks like, not what it means: on the demo image "bare soil", "dry
# patch", "soil", "dirt" and "brown soil" found nothing, "brown patch" found
# every patch (2026-10-30). Try it again on any new kind of imagery.
segmentation_prompt: brown patch
