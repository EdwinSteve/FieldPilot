# Farmer-facing messages in Spanish. Keys are the English codes used in code;
# rules and the gate never contain Spanish text. Every RuleCode must have an
# entry under `rules`, or the app refuses to start.
#
# Placeholders in {braces} are filled from the violation's or error's params.
# English is the default (APP_LANGUAGE=en, D084); APP_LANGUAGE=es uses this file.

language: es
decimal_separator: ","

rules:
  emergency_stop_active: "Pendiente de aprobación: parada de emergencia activa"
  always_approval_type: "Pendiente de aprobación: esta acción siempre requiere tu confirmación"
  daily_irrigation_cap_exceeded: >-
    Pendiente de aprobación: el riego del día sumaría {total_mm} mm, por encima
    del máximo de {limit_mm} mm
  rain_forecast_above_limit: "Pendiente de aprobación por lluvia prevista ({forecast_mm} mm > {limit_mm} mm)"
  irrigation_interval_too_short: >-
    Pendiente de aprobación: solo habrían pasado {hours_since_last} h desde el
    último riego (mínimo {min_hours} h)
  moisture_above_limit: >-
    Pendiente de aprobación: el suelo ya está al {moisture_pct_fc} % de su
    capacidad de campo (máximo {limit_pct_fc} %)
  calendar_shift_too_large: >-
    Pendiente de aprobación: mover la fecha {shift_days} días supera el máximo
    de {limit_days} días
  missing_input: "Pendiente de aprobación: falta un dato para decidir con seguridad ({input})"

# Names shown for `missing_input`, keyed by the input identifier.
inputs:
  rain_forecast_mm_24h: pronóstico de lluvia
  soil_moisture_vwc: humedad del suelo
  field_capacity_vwc: capacidad de campo de la zona
  volume_mm: volumen de riego
  shift_days: días de cambio de fecha

labels:
  already_decided: "Ya decidida el {decided_at}"
  notify_committed: >-
    Acción en marcha con aviso: puedes revertirla mientras la ventana esté
    abierta (reloj simulado)
  # D033: the farmer saw this task as scheduled, so name the rule that changed.
  scheduled_not_executed: "La tarea programada no se ejecutó: {rule}. Requiere una nueva decisión"
  execution_failed: "La tarea {task_id} no se pudo ejecutar y no se reintentará"
  # D013: no actuator record after a restart.
  execution_not_confirmed: >-
    La ejecución de la tarea {task_id} no se confirmó tras un reinicio del
    sistema. No se reintentará: requiere una nueva decisión
  # D032: never a bare "riego cerrado"; the farmer must know the amount is unknown.
  irrigation_interrupted: >-
    El riego de {requested_mm} mm en la zona {zone} pudo haber seguido después
    del reinicio del sistema. La cantidad de agua aplicada se desconoce
  # D083: the public passport never names a person.
  producer_of: "Productor de {place}"
  producer_unknown: "Productor de FieldPilot"
  # D088: la respuesta fija a una pregunta fuera del tema de un asistente.
  out_of_scope_farmer: "Solo puedo ayudarte con tu cultivo y tu campo: su etapa, el agua, la humedad del suelo, el clima y las tareas pendientes. ¿Qué quieres saber de tu cultivo?"
  out_of_scope_customer: "Solo puedo ayudarte con la tienda de FieldPilot: productos, precios y ofertas, tu carrito y tus pedidos, qué comprar para una comida y de dónde viene un producto. ¿Qué buscas hoy?"
  # D087: el asistente del carrito.
  cart_intro: "¡Hola! Vi que piensas comprar {cart}."
  cart_intro_empty: "¡Hola!"
  suggest_repurchase_due: "¿Quieres agregar {crop}? ¡La última vez que lo compraste fue {ago}!"
  suggest_bought_together: "¿Quieres agregar {crop}? Va muy bien con lo que estás comprando."
  suggest_deal_you_buy_it: "{Crop}, que sueles comprar, tiene {pct} % de descuento ahora. ¿Quieres agregarlo?"
  suggest_deal_goes_with: "{Crop} va muy bien con tu carrito y tiene {pct} % de descuento ahora. ¿Quieres agregarlo?"
  suggest_clearance_note: "Es mejor consumirlo en los próximos {days} días."
  suggest_on_offer: "{Crop} tiene {pct} % de descuento ahora. ¿Quieres agregarlo?"
  suggest_fresh_harvest: "¿Quieres agregar {crop}? Se cosechó {ago}."
  suggest_popular: "¿Quieres agregar {crop}? Es de lo más comprado este mes."
  suggest_add: "Sí, agrega {kg} kg de {crop}"
  suggest_better_deal: "Búscame una mejor oferta"
  suggest_none: "Tu carrito se ve completo. Por ahora no tengo nada más que sugerirte."
  suggest_no_better_deal: "Esa es la mejor oferta que encuentro para ti hoy."
  ago_today: "hoy"
  ago_yesterday: "ayer"
  ago_days: "hace {n} días"
  ago_week: "hace una semana"
  ago_weeks: "hace {n} semanas"
  ago_month: "hace un mes"
  ago_months: "hace {n} meses"

# Agent pipeline texts (D051, D052), addressed in code as "cycle.<key>" and
# "report.<key>".
cycle:
  # D051: a subagent ran out of turns. A real failure: the farmer is told.
  failed_turn_limit: >-
    El ciclo diario se detuvo sin terminar: el asistente agotó sus turnos.
    No se propuso ninguna acción nueva; revisa el registro
  # D051: the model service was unavailable. Written to the log, never an alert.
  paused_retry_next_run: >-
    Ciclo diario en pausa: el servicio del modelo no respondió. Se reintentará
    en la próxima ejecución
report:
  # D052: the third refused report. Nothing unverified is saved.
  escalated_unverified: >-
    El informe del día no pasó la verificación de datos y no se guardó.
    Revisa el registro de eventos

# Crop names shown to people (D079, D083).
crops:
  maize: Maíz
  common_bean: Fríjol
  sorghum: Sorgo
  soybean: Soya
  groundnut: Maní
  cotton: Algodón
  tomato: Tomate
  potato: Papa

