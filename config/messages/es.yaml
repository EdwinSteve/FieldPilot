# 503 answers: one fixed, safe message per error (§7).
unavailable:
  llm_unavailable: "El modelo no respondió. Intenta de nuevo en un momento."
  speech_unavailable: "El servicio de transcripción no respondió."
  chat_unavailable: "El chat necesita MOCK_LLM=0 y una clave de API."
  fixture_exhausted: "La respuesta grabada no corresponde a esta granja (MOCK_LLM=1)."
