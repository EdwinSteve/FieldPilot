[project]
name = "fieldpilot-planner"
version = "0.1.0"
description = "FieldPilot stage 1: a crop planner that recommends what to sow and when (D079)."
requires-python = ">=3.12,<3.13"
# Core: what the backend needs to build model inputs (features, crop cards).
dependencies = [
    "numpy>=2.3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Downloading the training data: rasterio (GDAL inside) reads the SoilGrids
# rasters; the REST API is about two minutes per point.
data = [
    "rasterio>=1.4",
]
# Training on the GPU machine. torch comes from the CUDA 12.8 index: the
# RTX 5060 Ti (Blackwell, sm_120) is not supported by older CUDA builds.
train = [
    "torch>=2.9",
    "onnx>=1.19",
    "onnxruntime>=1.23",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fieldpilot_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The backend's readability rules (D042), minus the event-log ones that do
# not apply to a batch pipeline: this CLI reports progress on the terminal.
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF",
    "C90", "PLR0911", "PLR0912", "PLR0915", "PLE", "PLW", "PLC0415",
    "ARG", "RET", "PIE", "C4", "PERF", "PTH", "ERA", "DTZ", "PT", "TC", "D100",
]
# N806/N803: array names such as `TAW`, `RAW` and `Dr` follow FAO-56 notation.
# N812: `functional as F` is the PyTorch convention.
ignore = ["N806", "N803", "N812", "PT018"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "D100"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "onnx", "onnx.*", "rasterio", "rasterio.*"]
ignore_missing_imports = true

# CI checks the planner without the training extra; torch's own types apply when installed.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true
