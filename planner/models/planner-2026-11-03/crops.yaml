# Crop cards for the planner (D079). Every value is published data, copied
# as printed; where a source gives a range, both ends are kept and the code
# uses the midpoint (a project convention, declared once in crops.py).
#
# Sources (verified 2026-11-02):
#   ecocrop  FAO ECOCROP, as distributed in the CRAN package Recocrop 0.4-2
#            (inst/parameters/ecocrop.rds; package SHA-256
#            90a21d908419e304e4e4c38c92df62d93b25cb373420fcd0a711247b1f47f358).
#            Hijmans R.J., Recocrop: Estimating Environmental Suitability for
#            Plants. The package notes these values are expert opinion.
#            Temperatures in °C, pH in water. `row` names the ECOCROP entry.
#   fao56    Allen R.G. et al. (1998), FAO Irrigation and Drainage Paper 56,
#            https://www.fao.org/4/x0490e/  Table 11 (stage lengths, days),
#            Table 12 (Kc; Kc ini is the group value), Table 22 (Zr in m, p),
#            Table 24 (seasonal Ky, from FAO Paper 33).
#
# Left out, with the reason:
#   rice     FAO-56 Table 24 has no Ky for rice, and paddy water management
#            is not a root-zone bucket.
#   cassava  FAO-56 Table 11 gives a two-year cycle; the planner models
#            cycles of at most 210 days.

crops:
  - crop: maize
    display_name: {en: Maize, es: Maíz}
    eva_names: [MAIZ]
    ecocrop: {row: "Maize", kill_c: 0, tmin_c: 10, topt_min_c: 18, topt_max_c: 33, tmax_c: 47,
              ph_min: 4.5, ph_opt_min: 5.0, ph_opt_max: 7.0, ph_max: 8.5}
    stages_days: {row: "Maize (grain), Nigeria (humid)", initial: 20, development: 35, mid: 40, late: 30}
    kc: {ini: 0.3, mid: 1.20, end: 0.60}   # end: high grain moisture (Table 12 note 11), as config/crops/maize.yaml
    root_depth_m: [1.0, 1.7]
    depletion_p: 0.55
    ky: 1.25

  - crop: common_bean
    display_name: {en: Common bean, es: Fríjol}
    eva_names: [FRIJOL]
    ecocrop: {row: "Bean, Common", kill_c: 0, tmin_c: 7, topt_min_c: 16, topt_max_c: 25, tmax_c: 32,
              ph_min: 4.0, ph_opt_min: 5.5, ph_opt_max: 7.5, ph_max: 9.0}
    stages_days: {row: "Beans (dry), Pakistan, Calif.", initial: 15, development: 25, mid: 35, late: 20}
    kc: {ini: 0.4, mid: 1.15, end: 0.35}
    root_depth_m: [0.6, 0.9]
    depletion_p: 0.45
    ky: 1.15

  - crop: sorghum
    display_name: {en: Sorghum, es: Sorgo}
    eva_names: [SORGO]
    ecocrop: {row: "Sorghum (low altitude)", kill_c: 0, tmin_c: 8, topt_min_c: 27, topt_max_c: 35, tmax_c: 40,
              ph_min: 5.0, ph_opt_min: 6.0, ph_opt_max: 7.0, ph_max: 8.5}
    stages_days: {row: "Sorghum, USA, Pakis., Med.", initial: 20, development: 35, mid: 40, late: 30}
    kc: {ini: 0.3, mid: [1.00, 1.10], end: 0.55}
    root_depth_m: [1.0, 2.0]
    depletion_p: 0.55
    ky: 0.9

  - crop: soybean
    display_name: {en: Soybean, es: Soya}
    eva_names: [SOYA]
    ecocrop: {row: "Soyabean", kill_c: 0, tmin_c: 10, topt_min_c: 20, topt_max_c: 33, tmax_c: 38,
              ph_min: 4.5, ph_opt_min: 5.5, ph_opt_max: 6.5, ph_max: 8.4}
    stages_days: {row: "Soybeans, Tropics", initial: 15, development: 15, mid: 40, late: 15}
    kc: {ini: 0.4, mid: 1.15, end: 0.50}
    root_depth_m: [0.6, 1.3]
    depletion_p: 0.50
    ky: 0.85

  - crop: groundnut
    display_name: {en: Groundnut, es: Maní}
    eva_names: [MANI]
    ecocrop: {row: "Groundnut", kill_c: 0, tmin_c: 10, topt_min_c: 22, topt_max_c: 32, tmax_c: 45,
              ph_min: 4.5, ph_opt_min: 5.5, ph_opt_max: 6.5, ph_max: 8.5}
    stages_days: {row: "Groundnut, West Africa", initial: 25, development: 35, mid: 45, late: 25}
    kc: {ini: 0.4, mid: 1.15, end: 0.60}
    root_depth_m: [0.5, 1.0]
    depletion_p: 0.50
    ky: 0.70

  - crop: cotton
    display_name: {en: Cotton, es: Algodón}
    eva_names: [ALGODON]
    ecocrop: {row: "Cotton, American upland", kill_c: 0, tmin_c: 15, topt_min_c: 22, topt_max_c: 36, tmax_c: 42,
              ph_min: 5.0, ph_opt_min: 6.0, ph_opt_max: 7.5, ph_max: 9.5}
    stages_days: {row: "Cotton, Texas", initial: 30, development: 50, mid: 55, late: 45}
    kc: {ini: 0.35, mid: [1.15, 1.20], end: [0.50, 0.70]}
    root_depth_m: [1.0, 1.7]
    depletion_p: 0.65
    ky: 0.85

  - crop: tomato
    display_name: {en: Tomato, es: Tomate}
    eva_names: [TOMATE]
    ecocrop: {row: "Tomato", kill_c: 0, tmin_c: 7, topt_min_c: 20, topt_max_c: 27, tmax_c: 35,
              ph_min: 5.0, ph_opt_min: 5.5, ph_opt_max: 6.8, ph_max: 7.5}
    stages_days: {row: "Tomato, Arid Region (January)", initial: 30, development: 40, mid: 40, late: 25}
    kc: {ini: 0.6, mid: 1.15, end: [0.70, 0.90]}
    root_depth_m: [0.7, 1.5]
    depletion_p: 0.40
    ky: 1.05

  - crop: potato
    display_name: {en: Potato, es: Papa}
    eva_names: [PAPA]
    ecocrop: {row: "Potato", kill_c: -1, tmin_c: 7, topt_min_c: 15, topt_max_c: 25, tmax_c: 30,
              ph_min: 4.2, ph_opt_min: 5.0, ph_opt_max: 6.2, ph_max: 8.5}
    stages_days: {row: "Potato, Continental Climate", initial: 25, development: 30, mid: 45, late: 30}
    kc: {ini: 0.5, mid: 1.15, end: 0.75}
    root_depth_m: [0.4, 0.6]
    depletion_p: 0.35
    ky: 1.1
