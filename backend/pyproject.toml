[project]
name = "fieldpilot-backend"
version = "0.1.0"
description = "FieldPilot backend: AI agent for irrigation and crop management."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.41.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Readability and cleanliness rules enforced in CI (D042). Each family is
# chosen because it catches something a reviewer would otherwise flag.
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF",  # base: errors, style, imports, bugbear
    "C90",                           # cyclomatic complexity (max 10)
    "PLR0911", "PLR0912", "PLR0915", # too many returns, branches or statements
    "PLE", "PLW", "PLC0415",         # pylint errors and warnings; imports at the top
    "ARG",                           # unused arguments
    "RET",                           # consistent, unambiguous returns
    "PIE", "C4", "PERF",             # needless code, comprehensions, simple performance
    "PTH",                           # pathlib instead of os.path
    "ERA",                           # no commented-out code
    "T20",                           # no print: the event log is the only channel (§4.5)
    "DTZ",                           # no naive datetimes: everything is aware UTC (§4.10)
    "SLF",                           # no access to another object's private members
    "PT",                            # pytest conventions
    "TC",                            # typing-only imports and casts
    "D100",                          # every application module has a docstring
]
ignore = [
    "PT018",  # `assert a is not None and a.x == 1` narrows types for mypy; kept on purpose
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true  # *args/**kwargs of a signature that must refuse everything

[tool.ruff.lint.per-file-ignores]
# Test doubles must keep the exact signatures of the protocols they replace,
# and test modules are named for what they test rather than documented.
"tests/**" = ["ARG", "D100"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Strict mode for the safety-critical packages (per-module equivalent of --strict).
[[tool.mypy.overrides]]
module = ["app.safety.*", "app.autonomy.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
